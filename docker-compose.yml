# 可选生产路径：PostgreSQL + pgvector。
# 默认开发路径是本地 SQLite（DB_PATH=data/app.db），本文件不属于默认运行链路。
# 需要时：pip install -e ".[pg]" 并 docker compose up -d，再把存储层切到 postgres。
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: second-brain-pg
    environment:
      POSTGRES_USER: brain
      POSTGRES_PASSWORD: brain
      POSTGRES_DB: brain
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brain -d brain"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata: