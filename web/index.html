<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>第二大脑 · 个人知识库</title>
<style>
/* Claude 设计规范（DESIGN.claude.md）：奶油画布 + 珊瑚橙 + 深暖墨，阴影克制 */
:root {
  --primary: #cc785c;
  --primary-pressed: #a9583e;
  --canvas: #faf9f5;
  --surface: #f5f0e8;
  --surface-soft: #f8f4ec;
  --surface-card: #efe9de;
  --hairline: #e6dfd8;
  --hairline-strong: #d8cfc4;
  --ink: #141413;
  --charcoal: #3d3d3a;
  --slate: #6c6a64;
  --steel: #6c6a64;
  --stone: #8e8b82;
  --muted: #b5b0a6;
  --tint-coral: #f3e0d5;
  --primary-deep: #8c4a33;
  --tint-teal: #dcebe6;
  --teal: #3f8f7d;
  --error: #c64545;
  --dark: #181715;
  --on-dark: #faf9f5;
  /* 展示标题用衬线（Claude 的 Copernicus 无公开字体，Georgia 是最接近的本地回退） */
  --font-display: Georgia, "Times New Roman", "SimSun", serif;
  --r-sm: 6px; --r-md: 8px; --r-lg: 12px;
  --shadow-1: rgba(20,20,19,.05) 0 1px 2px 0;
  --shadow-2: rgba(20,20,19,.08) 0 4px 12px 0;
}
::selection { background: var(--tint-coral); }
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body {
  font-family: Inter, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--canvas); color: var(--ink);
  font-size: 16px; line-height: 1.55;
  display: flex; overflow: hidden;
}
/* ---------- 侧栏 ---------- */
.sidebar {
  width: 300px; flex-shrink: 0; height: 100vh;
  background: var(--surface); border-right: 1px solid var(--hairline);
  display: flex; flex-direction: column;
}
.sidebar-head {
  padding: 20px 20px 16px; border-bottom: 1px solid var(--hairline);
}
.logo { font-family: var(--font-display); font-size: 21px; font-weight: 400; letter-spacing: -0.3px; }
.logo span { color: var(--primary); }
.logo-sub { font-size: 13px; color: var(--steel); margin-top: 2px; }
.panel-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 8px; margin-bottom: 6px;
}
.panel-head .doc-list-label { padding: 0; }
.link-btn {
  border: none; background: none; color: var(--primary);
  font-size: 12px; font-weight: 600; cursor: pointer;
  padding: 2px 6px; border-radius: var(--r-sm);
}
.link-btn:hover { background: var(--tint-coral); }
.link-btn:disabled { color: var(--muted); cursor: default; background: none; }
/* 会话列表 */
.sessions-box { padding: 12px 12px 4px; border-bottom: 1px solid var(--hairline); }
.session-list { max-height: 150px; overflow-y: auto; padding-bottom: 8px; }
.session-item {
  padding: 6px 10px; border-radius: var(--r-sm); font-size: 13px;
  color: var(--charcoal); cursor: pointer;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.session-item:hover { background: var(--hairline-soft, #ede9e4); }
.session-item.active { background: var(--tint-coral); color: var(--primary-deep); font-weight: 600; }
.ingest-box { padding: 16px 20px; border-bottom: 1px solid var(--hairline); }
.ingest-head {
  display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px;
}
.ingest-box label {
  display: block; font-size: 11px; font-weight: 600; letter-spacing: 1px;
  text-transform: uppercase; color: var(--stone);
}
.ingest-head label { margin-bottom: 0; }
.ingest-row { display: flex; gap: 8px; }
.ingest-row input {
  flex: 1; height: 36px; padding: 6px 12px; font-size: 14px;
  border: 1px solid var(--hairline); border-radius: var(--r-md);
  background: var(--canvas); color: var(--ink); outline: none;
  transition: border-color .15s ease;
}
.ingest-row input:focus { border: 2px solid var(--primary); padding: 5px 11px; }
.btn {
  height: 36px; padding: 0 16px; border: none; border-radius: var(--r-md);
  font-size: 14px; font-weight: 500; cursor: pointer;
  transition: background .15s ease; white-space: nowrap; flex-shrink: 0;
}
.btn-primary { background: var(--primary); color: #fff; }
.btn-primary:hover { background: var(--primary-pressed); }
.btn-primary:disabled { background: var(--hairline); color: var(--muted); cursor: default; }
.doc-list { flex: 1; overflow-y: auto; padding: 8px 12px; }
.doc-list-label {
  font-size: 11px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase;
  color: var(--stone); padding: 8px 8px 6px;
}
.doc-item {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 10px; border-radius: var(--r-sm); font-size: 14px;
  color: var(--charcoal); cursor: default;
}
.doc-item:hover { background: var(--hairline-soft, #ede9e4); }
.doc-item .doc-title { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.doc-item .doc-chunks {
  font-size: 12px; color: var(--stone); background: var(--canvas);
  border: 1px solid var(--hairline); border-radius: 9999px; padding: 0 8px;
}
.doc-item .doc-del {
  border: none; background: none; color: var(--muted); cursor: pointer;
  font-size: 14px; padding: 0 4px; border-radius: 4px; visibility: hidden;
}
.doc-item:hover .doc-del { visibility: visible; }
.doc-item .doc-del:hover { color: var(--error); }
.empty-docs { padding: 16px 8px; font-size: 13px; color: var(--stone); }
/* 记忆面板 */
.memory-box { flex-shrink: 0; border-top: 1px solid var(--hairline); padding: 12px 12px 4px; }
.memory-list { max-height: 200px; overflow-y: auto; padding-bottom: 8px; }
.mem-item {
  background: var(--canvas); border: 1px solid var(--hairline);
  border-radius: var(--r-sm); padding: 8px 10px; margin-bottom: 6px;
}
.mem-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.mem-kind { font-size: 11px; font-weight: 600; color: var(--steel); }
.mem-status { font-size: 11px; color: var(--stone); }
.mem-status.conflict { color: var(--error); font-weight: 600; }
.mem-content { font-size: 12px; color: var(--charcoal); word-break: break-word; }
/* ---------- 主区 ---------- */
.main { flex: 1; display: flex; flex-direction: column; height: 100vh; }
.chat-scroll { flex: 1; overflow-y: auto; }
.chat-inner { max-width: 760px; margin: 0 auto; padding: 32px 32px 16px; }
.hero-empty { text-align: center; padding-top: 15vh; }
.hero-empty h1 {
  font-family: var(--font-display);
  font-size: 36px; font-weight: 400; letter-spacing: -0.5px;
  line-height: 1.2; margin-bottom: 12px;
}
.hero-empty p { color: var(--steel); font-size: 16px; max-width: 460px; margin: 0 auto; }
.msg { margin-bottom: 24px; }
.msg-role {
  font-size: 11px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase;
  color: var(--stone); margin-bottom: 6px;
}
.msg.user .msg-role { color: var(--primary); }
.msg-body { word-break: break-word; color: var(--charcoal); }
.msg.user .msg-body { white-space: pre-wrap; color: var(--ink); font-weight: 500; }
/* Markdown 排版 */
.msg-body p { margin: 0 0 10px; }
.msg-body > :last-child { margin-bottom: 0; }
.msg-body h1, .msg-body h2, .msg-body h3, .msg-body h4 {
  font-size: 17px; font-weight: 600; margin: 14px 0 8px;
}
.msg-body ul, .msg-body ol { margin: 0 0 10px 22px; }
.msg-body li { margin-bottom: 2px; }
.msg-body a { color: var(--primary); }
.msg-body code {
  background: var(--surface-card); border-radius: 4px; padding: 1px 5px; font-size: 13px;
  font-family: ui-monospace, Consolas, "Courier New", monospace;
}
/* Claude 标志性的深色代码块（code-window-card）：深暖黑底 + 奶油字 */
.msg-body pre {
  background: var(--dark); color: var(--on-dark); border-radius: var(--r-lg);
  padding: 12px 14px; margin-bottom: 10px; overflow-x: auto;
}
.msg-body pre code { background: none; padding: 0; color: inherit; }
.msg-body blockquote {
  border-left: 3px solid var(--hairline-strong); padding-left: 12px;
  color: var(--slate); margin-bottom: 10px;
}
/* 工具调用指示 */
.tool-chip {
  display: inline-flex; align-items: center; gap: 6px;
  background: var(--tint-coral); color: var(--primary-deep);
  font-size: 13px; font-weight: 600; border-radius: 9999px;
  padding: 4px 12px; margin: 4px 0;
}
.tool-chip::before { content: "⌕"; }
.tool-chip.done { background: var(--tint-teal); color: var(--teal); }
.tool-chip.done::before { content: "✓"; }
/* 引用角标 */
cite.chunk-ref {
  font-style: normal; font-size: 12px; font-weight: 600;
  color: var(--primary); background: var(--tint-coral);
  border-radius: 4px; padding: 0 4px; cursor: pointer;
}
cite.chunk-ref:hover { background: var(--primary); color: #fff; }
/* 分块浮层 */
#popover {
  position: fixed; display: none; z-index: 50; width: 380px;
  max-height: 320px; overflow-y: auto;
  background: var(--canvas); border: 1px solid var(--hairline);
  border-radius: var(--r-md); box-shadow: var(--shadow-2); padding: 12px 14px;
}
.pop-title { font-size: 12px; font-weight: 600; color: var(--steel); margin-bottom: 6px; }
.pop-body { font-size: 14px; color: var(--charcoal); white-space: pre-wrap; word-break: break-word; }
/* 输入区 */
.composer { border-top: 1px solid var(--hairline); background: var(--canvas); }
.composer-inner { max-width: 760px; margin: 0 auto; padding: 16px 32px 20px; }
.composer-box {
  display: flex; align-items: flex-end; gap: 8px;
  border: 1px solid var(--hairline); border-radius: var(--r-lg);
  background: var(--canvas); padding: 10px 12px;
  box-shadow: var(--shadow-1); transition: border-color .15s ease;
}
.composer-box:focus-within { border-color: var(--primary); box-shadow: var(--shadow-2); }
.composer-box textarea {
  flex: 1; border: none; outline: none; resize: none;
  font: inherit; font-size: 15px; color: var(--ink);
  max-height: 160px; background: transparent;
}
.composer-box textarea::placeholder { color: var(--muted); }
.send-btn {
  width: 36px; height: 36px; border: none; border-radius: var(--r-md);
  background: var(--primary); color: #fff; font-size: 16px; cursor: pointer;
  flex-shrink: 0; transition: background .15s ease;
}
.send-btn:hover { background: var(--primary-pressed); }
.send-btn:disabled { background: var(--hairline); color: var(--muted); cursor: default; }
.hint { font-size: 12px; color: var(--stone); margin-top: 8px; text-align: center; }
/* 错误条 */
.error-bar {
  background: #fdecec; color: var(--error); font-size: 13px; font-weight: 500;
  border: 1px solid #f5c6c6; border-radius: var(--r-md);
  padding: 8px 12px; margin-top: 12px;
}
/* 打字光标 */
.cursor-blink::after {
  content: "▍"; color: var(--primary); animation: blink 1s step-end infinite;
}
@keyframes blink { 50% { opacity: 0; } }
#menu-btn {
  display: none; position: fixed; top: 10px; left: 10px; z-index: 30;
  width: 36px; height: 36px; border: 1px solid var(--hairline-strong);
  border-radius: var(--r-md); background: var(--canvas); font-size: 16px; cursor: pointer;
}
@media (max-width: 820px) {
  #menu-btn { display: block; }
  .sidebar {
    position: fixed; left: 0; top: 0; z-index: 40;
    transform: translateX(-100%); transition: transform .2s ease;
    box-shadow: var(--shadow-2);
  }
  .sidebar.open { transform: none; }
  .chat-inner, .composer-inner { padding-left: 20px; padding-right: 20px; }
}
/* ---------- 设置面板 ---------- */
.sidebar-head { position: relative; }
#settings-btn {
  position: absolute; top: 16px; right: 16px;
  width: 32px; height: 32px; border: 1px solid var(--hairline);
  border-radius: var(--r-md); background: var(--canvas); color: var(--slate);
  font-size: 15px; cursor: pointer;
}
#settings-btn:hover { color: var(--ink); border-color: var(--hairline-strong); }
#settings-mask {
  position: fixed; inset: 0; z-index: 60; display: none;
  background: rgba(20,20,19,.4); align-items: flex-start; justify-content: center;
}
#settings-panel {
  width: 420px; max-width: calc(100vw - 48px); max-height: 85vh; overflow-y: auto;
  margin-top: 8vh; background: var(--canvas); border: 1px solid var(--hairline);
  border-radius: var(--r-lg); padding: 24px 28px 28px; box-shadow: var(--shadow-2);
}
.set-head {
  display: flex; align-items: center; justify-content: space-between;
  font-family: var(--font-display); font-size: 22px; margin-bottom: 4px;
}
.set-head button { border: none; background: none; font-size: 14px; color: var(--stone); cursor: pointer; }
.set-head button:hover { color: var(--ink); }
.set-sec {
  font-size: 12px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase;
  color: var(--stone); margin: 16px 0 8px; padding-top: 16px;
  border-top: 1px solid var(--hairline);
}
.set-sec:first-of-type { border-top: none; padding-top: 0; }
.set-note {
  display: block; font-size: 12px; font-weight: 400; letter-spacing: 0;
  text-transform: none; color: var(--muted); margin-top: 2px;
}
.set-label { display: block; font-size: 13px; font-weight: 500; color: var(--charcoal); margin: 10px 0 4px; }
#settings-panel input, #settings-panel select {
  width: 100%; height: 40px; padding: 10px 14px; font-size: 14px;
  border: 1px solid var(--hairline); border-radius: var(--r-md);
  background: var(--canvas); color: var(--ink); outline: none;
}
#settings-panel input:focus, #settings-panel select:focus { border-color: var(--primary); }
.set-actions { margin-top: 20px; display: flex; justify-content: flex-end; }
.set-actions .btn { height: 40px; padding: 0 24px; }
/* 模型字段的标签行：右侧挂「拉取模型」。次级动作用 button-secondary 的紧凑版
   （奶油底 + 发丝描边），不用珊瑚色文字链——它在安静的表单里太扎眼 */
.set-label-row {
  display: flex; align-items: center; justify-content: space-between;
  gap: 8px; margin: 10px 0 4px;
}
.set-label-row .set-label { margin: 0; }
.set-fetch {
  height: 26px; padding: 0 10px; flex-shrink: 0;
  font-size: 12px; font-weight: 500; cursor: pointer;
  border: 1px solid var(--hairline); border-radius: var(--r-sm);
  background: var(--canvas); color: var(--slate);
}
.set-fetch:hover { border-color: var(--hairline-strong); color: var(--ink); }
.set-fetch:disabled { color: var(--muted); cursor: default; }
/* 拉取结果就地反馈：showError 的错误条在遮罩底下看不见，面板内得有自己的状态行 */
.set-status { display: block; font-size: 12px; color: var(--stone); margin-top: 4px; }
.set-status.err { color: var(--error); }
/* 模型建议下拉。原生 datalist 由系统渲染、样式完全改不动，跟奶油底/珊瑚色对不上，
   所以自建浮层，样式与 #popover 同源。挂 body + fixed 定位是为了不被
   #settings-panel 的 overflow:auto 裁掉 */
#set-suggest {
  position: fixed; display: none; z-index: 70;
  max-height: 240px; overflow-y: auto; padding: 4px;
  background: var(--canvas); border: 1px solid var(--hairline);
  border-radius: var(--r-md); box-shadow: var(--shadow-2);
}
.set-suggest-item {
  padding: 7px 10px; border-radius: var(--r-sm); font-size: 13px;
  color: var(--charcoal); cursor: pointer;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.set-suggest-item:hover, .set-suggest-item.active { background: var(--tint-coral); color: var(--ink); }
.set-suggest-empty { padding: 7px 10px; font-size: 13px; color: var(--muted); }
</style>
</head>
<body>
<button id="menu-btn" title="菜单">☰</button>
<aside class="sidebar">
  <div class="sidebar-head">
    <div class="logo">第二<span>大脑</span></div>
    <div class="logo-sub">个人知识库 Agent</div>
    <button id="settings-btn" title="模型设置">⚙</button>
  </div>
  <div class="sessions-box">
    <div class="panel-head">
      <span class="doc-list-label">对话</span>
      <button class="link-btn" id="new-session">新对话</button>
    </div>
    <div class="session-list" id="session-list"></div>
  </div>
  <div class="ingest-box">
    <div class="ingest-head">
      <label>导入文档</label>
      <button class="link-btn" id="upload-btn">上传文件</button>
      <input type="file" id="file-input" accept=".md,.markdown,.pdf,.txt" hidden>
    </div>
    <div class="ingest-row">
      <input id="ingest-input" placeholder="文件路径或 URL…">
      <button class="btn btn-primary" id="ingest-btn">导入</button>
    </div>
  </div>
  <div class="doc-list" id="doc-list">
    <div class="doc-list-label">知识库文档</div>
    <div class="empty-docs" id="empty-docs">还没有文档，先导入一篇笔记或面经吧。</div>
  </div>
  <div class="memory-box">
    <div class="panel-head"><span class="doc-list-label">记忆</span></div>
    <div class="memory-list" id="memory-list"></div>
  </div>
</aside>
<main class="main">
  <div class="chat-scroll" id="chat-scroll">
    <div class="chat-inner" id="chat">
      <div class="hero-empty" id="hero">
        <h1>问你的知识库<br>任何问题</h1>
        <p>笔记、面经、收藏的文章——导入之后，用自然语言检索，回答附带来源引用。</p>
      </div>
    </div>
  </div>
  <div class="composer">
    <div class="composer-inner">
      <div class="composer-box">
        <textarea id="input" rows="1" placeholder="问点什么… (Enter 发送，Shift+Enter 换行)"></textarea>
        <button class="send-btn" id="send" title="发送">↑</button>
      </div>
      <div class="hint" id="hint">回答基于你的知识库检索结果生成</div>
      <div id="error-slot"></div>
    </div>
  </div>
</main>
<div id="popover"></div>
<div id="set-suggest"></div>
<div id="settings-mask">
  <div id="settings-panel">
    <div class="set-head"><span>模型设置</span><button id="settings-close" title="关闭">✕</button></div>
    <div class="set-sec">对话模型（LLM）<span class="set-note">保存后立即生效，无需重启</span></div>
    <label class="set-label">供应商</label>
    <select id="set-provider">
      <option value="openai_compat">OpenAI 兼容</option>
      <option value="anthropic">Anthropic</option>
    </select>
    <div id="set-openai">
      <label class="set-label">Base URL</label>
      <input id="set-openai-base-url" placeholder="留空 = OpenAI 官方端点">
      <label class="set-label">API Key</label>
      <input id="set-openai-key" type="password">
      <div class="set-label-row">
        <label class="set-label" for="set-openai-model">模型</label>
        <button class="set-fetch" id="set-openai-fetch" type="button">拉取模型</button>
      </div>
      <input id="set-openai-model" autocomplete="off" placeholder="如 deepseek-chat / gpt-4o-mini">
      <span class="set-status" id="set-openai-fetch-status"></span>
    </div>
    <div id="set-anthropic" hidden>
      <label class="set-label">API Key</label>
      <input id="set-anthropic-key" type="password">
      <label class="set-label">模型</label>
      <input id="set-anthropic-model">
    </div>
    <div class="set-sec">Embedding<span class="set-note">换模型后向量维度必须与原来一致，否则需删除并重新导入文档</span></div>
    <label class="set-label">Base URL</label>
    <input id="set-embed-base-url">
    <label class="set-label">API Key</label>
    <input id="set-embed-key" type="password">
    <div class="set-label-row">
      <label class="set-label" for="set-embed-model">模型</label>
      <button class="set-fetch" id="set-embed-fetch" type="button">拉取模型</button>
    </div>
    <input id="set-embed-model" autocomplete="off">
    <span class="set-status" id="set-embed-fetch-status"></span>
    <div class="set-actions"><button class="btn btn-primary" id="settings-save">保存</button></div>
  </div>
</div>
<script src="/vendor/marked.min.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const chatEl = $("chat"), inputEl = $("input"), sendBtn = $("send");
const HERO_HTML = $("hero").outerHTML;
const LS_KEY = "brain.sessionId";
let sessionId = localStorage.getItem(LS_KEY), busy = false, controller = null;

/* 移动端抽屉：☰ 开关；点会话项/新对话/抽屉外区域自动收起 */
const sidebarEl = document.querySelector(".sidebar");
$("menu-btn").onclick = () => sidebarEl.classList.toggle("open");

function esc(s) {
  return s.replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
/* marked v15 不 sanitize：raw HTML 转义为纯文本显示，链接 href 做 scheme 白名单 */
if (window.marked) marked.use({
  renderer: {
    html(token) { return esc(token.text); },
    link(token) {
      const text = this.parser.parseInline(token.tokens);
      const href = token.href || "";
      const ok = /^(https?:|mailto:|#|\/|\.)/i.test(href) || !/^[a-z][a-z0-9+.-]*:/i.test(href);
      if (!ok) return text;
      return `<a href="${esc(href)}"${token.title ? ` title="${esc(token.title)}"` : ""}>${text}</a>`;
    },
  },
});
function showHint(t) { $("hint").textContent = t; }
function showError(t) {
  $("error-slot").innerHTML = `<div class="error-bar">${esc(t)}</div>`;
  setTimeout(() => $("error-slot").innerHTML = "", 6000);
}
/* 非 200 时尽量读后端给的 detail */
async function errText(r) {
  const d = await r.json().catch(() => ({}));
  return d.detail || `HTTP ${r.status}`;
}
function scrollBottom() {
  const s = $("chat-scroll"); s.scrollTop = s.scrollHeight;
}

/* ---------- 消息渲染 ---------- */
function addMsg(role) {
  $("hero")?.remove();
  const div = document.createElement("div");
  div.className = `msg ${role}`;
  div.innerHTML = `<div class="msg-role">${role === "user" ? "你" : "知识库"}</div><div class="msg-body"></div>`;
  chatEl.appendChild(div);
  scrollBottom();
  return div.querySelector(".msg-body");
}
function addToolChip(name) {
  const chip = document.createElement("div");
  chip.className = "tool-chip";
  chip.textContent = `检索知识库：${name}`;
  chatEl.appendChild(chip);
  scrollBottom();
  return chip;
}
/* Markdown 渲染，再把 [chunk N] 换成可点击的引用角标 */
function renderCitations(el, text) {
  el.innerHTML = window.marked ? marked.parse(text) : esc(text);
  const walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT);
  const nodes = [];
  while (walker.nextNode()) nodes.push(walker.currentNode);
  for (const node of nodes) {
    const s = node.nodeValue;
    if (!/\[chunk \d+\]/.test(s)) continue;
    const frag = document.createDocumentFragment();
    let last = 0;
    for (const m of s.matchAll(/\[chunk (\d+)\]/g)) {
      frag.append(s.slice(last, m.index));
      const cite = document.createElement("cite");
      cite.className = "chunk-ref";
      cite.dataset.chunk = m[1];
      cite.textContent = `[${m[1]}]`;
      frag.append(cite);
      last = m.index + m[0].length;
    }
    frag.append(s.slice(last));
    node.replaceWith(frag);
  }
}
function clearChat() { chatEl.innerHTML = HERO_HTML; }

/* ---------- 引用浮层 ---------- */
function closePopover() { $("popover").style.display = "none"; }
async function showChunk(cite) {
  const pop = $("popover");
  try {
    const r = await fetch(`/api/chunks/${cite.dataset.chunk}`);
    if (!r.ok) throw new Error(await errText(r));
    const c = await r.json();
    pop.innerHTML = `<div class="pop-title"></div><div class="pop-body"></div>`;
    pop.querySelector(".pop-title").textContent = c.title || c.source || "未命名来源";
    pop.querySelector(".pop-body").textContent = c.content || "";
    pop.style.display = "block";
    const b = cite.getBoundingClientRect();
    pop.style.left = Math.max(12, Math.min(b.left, innerWidth - pop.offsetWidth - 12)) + "px";
    const below = b.bottom + 8;
    pop.style.top = (below + pop.offsetHeight > innerHeight
      ? Math.max(12, b.top - pop.offsetHeight - 8) : below) + "px";
  } catch (e) { showError(e.message); }
}
chatEl.addEventListener("click", (e) => {
  const cite = e.target.closest("cite.chunk-ref");
  if (!cite) return;
  e.stopPropagation();
  showChunk(cite);
});
document.addEventListener("click", (e) => {
  if (!e.target.closest("#popover")) closePopover();
  if (!e.target.closest(".sidebar") && !e.target.closest("#menu-btn")) sidebarEl.classList.remove("open");
});

/* ---------- 文档管理 ---------- */
async function loadDocs() {
  try {
    const r = await fetch("/api/documents");
    if (!r.ok) throw new Error(await errText(r));
    const docs = await r.json();
    const list = $("doc-list");
    list.querySelectorAll(".doc-item").forEach(e => e.remove());
    $("empty-docs").style.display = docs.length ? "none" : "";
    for (const d of docs) {
      const item = document.createElement("div");
      item.className = "doc-item";
      item.innerHTML = `<span class="doc-title" title="${esc(d.source || "")}">${esc(d.title || "未命名")}</span>
        <span class="doc-chunks">${d.chunk_count ?? ""}</span>
        <button class="doc-del" title="删除">✕</button>`;
      item.querySelector(".doc-del").onclick = async () => {
        if (!confirm(`删除「${d.title}」？`)) return;
        const r = await fetch(`/api/documents/${d.id}`, { method: "DELETE" });
        if (!r.ok) { showError(await errText(r)); return; }
        loadDocs();
      };
      list.appendChild(item);
    }
  } catch (e) { showError(e.message); }
}

$("ingest-btn").onclick = async () => {
  const src = $("ingest-input").value.trim();
  if (!src) return;
  const btn = $("ingest-btn");
  btn.disabled = true; btn.textContent = "…";
  try {
    const r = await fetch("/api/ingest", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ source: src }),
    });
    if (!r.ok) throw new Error(await errText(r));
    const data = await r.json();
    $("ingest-input").value = "";
    showHint(`已导入，共 ${data.chunks} 个分块`);
    loadDocs();
  } catch (e) { showError(e.message); }
  finally { btn.disabled = false; btn.textContent = "导入"; }
};

/* 上传文件 */
$("upload-btn").onclick = () => $("file-input").click();
$("file-input").onchange = async () => {
  const file = $("file-input").files[0];
  if (!file) return;
  const btn = $("upload-btn");
  const fd = new FormData();
  fd.append("file", file);
  btn.disabled = true; btn.textContent = "上传中…";
  try {
    const r = await fetch("/api/ingest/upload", { method: "POST", body: fd });
    if (!r.ok) throw new Error(await errText(r));
    const data = await r.json();
    showHint(`已导入 ${file.name}，共 ${data.chunks} 个分块`);
    loadDocs();
  } catch (e) { showError(e.message); }
  finally {
    btn.disabled = false; btn.textContent = "上传文件";
    $("file-input").value = "";
  }
};

/* ---------- 会话 ---------- */
async function loadSessions() {
  try {
    const r = await fetch("/api/sessions");
    if (!r.ok) throw new Error(await errText(r));
    const sessions = await r.json();
    const list = $("session-list");
    list.innerHTML = "";
    for (const s of sessions) {
      const item = document.createElement("div");
      item.className = "session-item" + (s.id === sessionId ? " active" : "");
      item.textContent = s.title || "（空对话）";
      item.title = `${s.title || "空对话"} · ${s.message_count ?? 0} 条消息`;
      item.onclick = () => openSession(s.id);
      list.appendChild(item);
    }
  } catch (e) { showError(e.message); }
}
async function openSession(id) {
  if (busy) return;
  sessionId = id; localStorage.setItem(LS_KEY, id);
  closePopover();
  sidebarEl.classList.remove("open");
  clearChat();
  loadSessions();
  try {
    const r = await fetch(`/api/sessions/${id}/messages`);
    if (!r.ok) throw new Error(await errText(r));
    for (const m of await r.json()) {
      if (m.role === "user") addMsg("user").textContent = m.content || "";
      else renderCitations(addMsg("assistant"), m.content || "");
    }
    scrollBottom();
  } catch (e) { showError(e.message); }
}
$("new-session").onclick = () => {
  if (busy) return;
  sessionId = null;
  localStorage.removeItem(LS_KEY);
  closePopover();
  sidebarEl.classList.remove("open");
  clearChat();
  loadSessions();
  inputEl.focus();
};

/* ---------- 记忆 ---------- */
async function loadMemories() {
  try {
    const r = await fetch("/api/memories");
    if (!r.ok) throw new Error(await errText(r));
    const mems = await r.json();
    const list = $("memory-list");
    list.innerHTML = "";
    if (!mems.length) {
      list.innerHTML = `<div class="empty-docs">还没有抽取到记忆</div>`;
      return;
    }
    for (const m of mems) {
      const item = document.createElement("div");
      item.className = "mem-item";
      item.innerHTML = `<div class="mem-head"><span class="mem-kind">${esc(m.kind || "")}</span>
        <span class="mem-status${m.status === "conflict" ? " conflict" : ""}">${esc(m.status || "")}</span></div>
        <div class="mem-content"></div>`;
      item.querySelector(".mem-content").textContent = m.content || "";
      list.appendChild(item);
    }
  } catch (e) { showError(e.message); }
}

/* ---------- 聊天 ---------- */
async function send() {
  const text = inputEl.value.trim();
  if (!text || busy) return;
  busy = true; controller = new AbortController();
  sendBtn.textContent = "■"; sendBtn.title = "停止生成";
  inputEl.value = ""; inputEl.style.height = "auto";
  addMsg("user").textContent = text;
  const answerEl = addMsg("assistant");
  answerEl.classList.add("cursor-blink");
  let answer = "", chips = [];
  try {
    const resp = await fetch("/api/chat", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ session_id: sessionId, message: text }),
      signal: controller.signal,
    });
    if (!resp.ok) throw new Error(await errText(resp));
    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buf = "";
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      const parts = buf.split("\n\n");
      buf = parts.pop();
      for (const p of parts) {
        if (!p.startsWith("data: ")) continue;
        const ev = JSON.parse(p.slice(6));
        if (ev.type === "session") {
          sessionId = ev.data.session_id;
          localStorage.setItem(LS_KEY, sessionId);
        }
        else if (ev.type === "text_delta") {
          answer += ev.data.text;
          renderCitations(answerEl, answer);
          scrollBottom();
        }
        else if (ev.type === "tool_start") chips.push(addToolChip(ev.data.arguments?.query ?? ev.data.name ?? ""));
        else if (ev.type === "tool_end") chips.forEach(c => c.classList.add("done"));
        else if (ev.type === "error") throw new Error(ev.data.message || "生成出错");
        else if (ev.type === "done") { /* 回合结束 */ }
      }
    }
  } catch (e) {
    if (e.name === "AbortError") showHint("已停止生成");
    else showError(e.message);
  } finally {
    answerEl.classList.remove("cursor-blink");
    busy = false; controller = null;
    sendBtn.textContent = "↑"; sendBtn.title = "发送";
    inputEl.focus();
    loadSessions();
    loadMemories();
  }
}

sendBtn.onclick = () => controller ? controller.abort() : send();
inputEl.onkeydown = (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
};
inputEl.oninput = () => {
  inputEl.style.height = "auto";
  inputEl.style.height = Math.min(inputEl.scrollHeight, 160) + "px";
};
$("ingest-input").onkeydown = (e) => { if (e.key === "Enter") $("ingest-btn").click(); };

/* ---------- 设置面板 ---------- */
const settingsMask = $("settings-mask");
const KEY_INPUTS = [["set-openai-key", "openai_api_key"], ["set-anthropic-key", "anthropic_api_key"], ["set-embed-key", "embed_api_key"]];
function toggleProviderFields() {
  const isOpenai = $("set-provider").value === "openai_compat";
  $("set-openai").hidden = !isOpenai;
  $("set-anthropic").hidden = isOpenai;
}
$("set-provider").onchange = toggleProviderFields;
$("settings-btn").onclick = async () => {
  try {
    const r = await fetch("/api/settings");
    if (!r.ok) throw new Error(await errText(r));
    const s = await r.json();
    $("set-provider").value = s.llm_provider;
    $("set-openai-base-url").value = s.openai_base_url;
    $("set-openai-model").value = s.openai_model;
    $("set-anthropic-model").value = s.anthropic_model;
    $("set-embed-base-url").value = s.embed_base_url;
    $("set-embed-model").value = s.embed_model;
    // 密钥不回填全量：placeholder 显示脱敏现状，留空 = 保持不变
    for (const [id, field] of KEY_INPUTS) {
      $(id).value = "";
      $(id).placeholder = s[field] ? `当前 ${s[field]}，留空保持不变` : "未设置";
    }
    toggleProviderFields();
    settingsMask.style.display = "flex";
  } catch (e) { showError(e.message); }
};
$("settings-close").onclick = () => { settingsMask.style.display = "none"; hideSuggest(); };
settingsMask.onclick = (e) => { if (e.target === settingsMask) { settingsMask.style.display = "none"; hideSuggest(); } };
/* 面板能滚：浮层是 fixed 定位，不跟着走就会飘在错的位置 */
$("settings-panel").addEventListener("scroll", hideSuggest);
/* 拉取模型：只认面板里当前填的值（base_url/key 留空则由后端回落已保存配置）。
   拉回来的清单只做输入建议，不替用户改字段——端点返回的清单里混着对话与
   embedding 模型，猜错还不如不猜 */
const FETCH_BUTTONS = [
  { btn: "set-openai-fetch", status: "set-openai-fetch-status", input: "set-openai-model", kind: "llm", baseUrl: "set-openai-base-url", key: "set-openai-key" },
  { btn: "set-embed-fetch", status: "set-embed-fetch-status", input: "set-embed-model", kind: "embed", baseUrl: "set-embed-base-url", key: "set-embed-key" },
];
function setStatus(id, text, isErr) {
  const el = $(id);
  el.textContent = text;
  el.classList.toggle("err", !!isErr);
}

/* 模型建议下拉：自建浮层替代原生 datalist（后者样式改不动，跟设计体系对不上）。
   挂 body + fixed，免得被 #settings-panel 的 overflow:auto 裁掉 */
const suggestEl = $("set-suggest");
let suggestInput = null, suggestItems = [], suggestActive = -1;
function hideSuggest() {
  suggestEl.style.display = "none";
  suggestInput = null; suggestItems = []; suggestActive = -1;
}
function renderSuggest() {
  suggestEl.innerHTML = suggestItems.length
    ? suggestItems.map((m, i) => `<div class="set-suggest-item${i === suggestActive ? " active" : ""}" data-i="${i}">${esc(m)}</div>`).join("")
    : `<div class="set-suggest-empty">没有匹配的模型</div>`;
}
function openSuggest(input) {
  if (!input.dataset.models || !input.dataset.models.length) return;
  const kw = input.value.trim().toLowerCase();
  suggestItems = JSON.parse(input.dataset.models).filter(m => m.toLowerCase().includes(kw));
  suggestActive = -1;
  renderSuggest();
  const r = input.getBoundingClientRect();
  const GAP = 4, PAD = 8;
  suggestEl.style.left = r.left + "px";
  suggestEl.style.width = r.width + "px";
  // 先显示再量高度：隐藏元素量不出真实尺寸。下方空间不够就向上翻，并按可用
  // 空间收紧高度，否则靠近视口底部的输入框会把浮层裁掉
  suggestEl.style.maxHeight = "240px";
  suggestEl.style.top = r.bottom + GAP + "px";
  suggestEl.style.display = "block";
  const below = window.innerHeight - r.bottom - GAP - PAD;
  const above = r.top - GAP - PAD;
  if (suggestEl.offsetHeight > below && above > below) {
    suggestEl.style.top = Math.max(PAD, r.top - GAP - Math.min(suggestEl.offsetHeight, above)) + "px";
  } else {
    suggestEl.style.maxHeight = Math.max(80, Math.min(240, below)) + "px";
  }
  suggestInput = input;
}
function pickSuggest(input, value) {
  input.value = value;
  hideSuggest();
}
suggestEl.onmousedown = (e) => {
  // mousedown 而非 click：click 前输入框会先 blur，浮层已经收起来了
  const item = e.target.closest(".set-suggest-item");
  if (item && suggestInput) { e.preventDefault(); pickSuggest(suggestInput, suggestItems[+item.dataset.i]); }
};
for (const cfg of FETCH_BUTTONS) {
  const inputEl = $(cfg.input);
  inputEl.addEventListener("input", () => openSuggest(inputEl));
  inputEl.addEventListener("focus", () => openSuggest(inputEl));
  inputEl.addEventListener("blur", () => setTimeout(hideSuggest, 120));
  inputEl.addEventListener("keydown", (e) => {
    if (suggestEl.style.display !== "block") return;
    if (e.key === "Escape") { hideSuggest(); return; }
    if (e.key === "ArrowDown" || e.key === "ArrowUp") {
      e.preventDefault();
      const n = suggestItems.length;
      suggestActive = e.key === "ArrowDown" ? (suggestActive + 1) % n : (suggestActive - 1 + n) % n;
      renderSuggest();
      suggestEl.querySelector(".active")?.scrollIntoView({ block: "nearest" });
    } else if (e.key === "Enter" && suggestActive >= 0) {
      e.preventDefault();
      pickSuggest(inputEl, suggestItems[suggestActive]);
    }
  });

  $(cfg.btn).onclick = async () => {
    const btn = $(cfg.btn);
    btn.disabled = true; btn.textContent = "拉取中…";
    setStatus(cfg.status, "", false);
    hideSuggest();  // 上一次拉取留下的浮层可能还开着，先收掉
    try {
      const r = await fetch("/api/models", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          kind: cfg.kind,
          base_url: $(cfg.baseUrl).value.trim(),
          api_key: $(cfg.key).value.trim(),
        }),
      });
      if (!r.ok) throw new Error(await errText(r));
      const { models } = await r.json();
      inputEl.dataset.models = JSON.stringify(models);
      setStatus(cfg.status, models.length ? `已拉取 ${models.length} 个模型，点输入框可挑选` : "该端点没有返回任何模型", !models.length);
      if (models.length) openSuggest(inputEl);
    } catch (e) { setStatus(cfg.status, e.message, true); }
    finally { btn.disabled = false; btn.textContent = "拉取模型"; }
  };
}
$("settings-save").onclick = async () => {
  // 只提交当前选中供应商的字段，避免把另一家没填的配置清掉
  const body = {
    llm_provider: $("set-provider").value,
    embed_base_url: $("set-embed-base-url").value.trim(),
    embed_model: $("set-embed-model").value.trim(),
  };
  if (body.llm_provider === "openai_compat") {
    body.openai_base_url = $("set-openai-base-url").value.trim();
    body.openai_model = $("set-openai-model").value.trim();
  } else {
    body.anthropic_model = $("set-anthropic-model").value.trim();
  }
  for (const [id, field] of KEY_INPUTS) {
    const v = $(id).value.trim();
    if (v) body[field] = v;
  }
  const btn = $("settings-save");
  btn.disabled = true; btn.textContent = "…";
  try {
    const r = await fetch("/api/settings", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
    if (!r.ok) throw new Error(await errText(r));
    settingsMask.style.display = "none";
    showHint("模型配置已保存，立即生效");
  } catch (e) { showError(e.message); }
  finally { btn.disabled = false; btn.textContent = "保存"; }
};

loadDocs();
loadMemories();
sessionId ? openSession(sessionId) : loadSessions();
inputEl.focus();
</script>
