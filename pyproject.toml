[project]
name = "yiyun-agent"
version = "0.1.0"
description = "忆云 Agent：个人知识管理 Agent（分层记忆 × 上下文治理 × Skill 化 × 评测）"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "openai",
    "anthropic",
    "pydantic>=2",
    "pydantic-settings",
    "aiosqlite",
    "sqlite-vec",
    "rank-bm25",
    "httpx",
    "pymupdf",
    "python-frontmatter",
    "python-multipart",
    # 定时任务（T5）：cron 表达式解析。tzlocal/tzdata 是同一功能的运行时前提而非可选项——
    # zoneinfo 在 Windows 上没有系统 tz 数据库（必须带 tzdata），而 Windows 注册表里存的是
    # "China Standard Time" 这类 Windows 时区 ID，stdlib 没有映射表，只有 tzlocal 能给出
    # 可用的 IANA 名（如 Asia/Shanghai）。
    "croniter",
    "tzlocal",
    "tzdata",
    "pywebview",
    "pystray",
    "pillow",
    "pyinstaller",
    "pytest",
    "pytest-asyncio",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"